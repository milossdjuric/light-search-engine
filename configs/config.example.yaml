# Search Engine Configuration Example
# Copy to configs/local.yaml and adjust as needed.
# Run: go run cmd/server/main.go -config configs/local.yaml

server:
  host: "0.0.0.0"
  port: 8080
  # mode: coordinator | shard
  mode: "shard"

storage:
  path: "data/manifest.json"
  data_dir: "data"

index:
  # mem_threshold_mb: flush in-memory buffer when it exceeds this size
  mem_threshold_mb: 512
  # max_buffer_docs: also flush when this many documents are buffered
  max_buffer_docs: 100000
  # num_shards: immutable after first index — changing requires full re-index
  num_shards: 4
  bm25_k1: 1.2
  bm25_b: 0.75
  segments_per_tier: 15
  max_merge_at_once: 10
  max_merge_size_mb: 256
  merge_rate_limit_mbps: 80
  # segment_compression: "" (default, fastest) | "lz4" (~1.3× ratio, ~3 GB/s decompress)
  segment_compression: ""
  # bloom_fp_rate: per-segment bloom filter (0 = disabled). 0.01 recommended.
  bloom_fp_rate: 0.01
  merge_on_startup: true
  startup_merge_target: 2
  warmup_on_startup: true
  warmup_mode: "tiered"        # top_k | full | tiered
  warmup_tier_threshold_mb: 600
  warmup_top_terms: 1000
  stemming:
    enabled: false
    language: "english"
  stopwords:
    enabled: false
    language: "en"

search:
  # global_fusion: "score" (default) | "rrf"
  global_fusion: "score"
  default_top_k: 10
  query_cache_size: 1000
  doc_cache_size: 50000

logging:
  level: "info"
  format: "text"

object_store:
  driver: "local"
  s3:
    bucket: ""
    region: "us-east-1"
    key_prefix: ""
    endpoint: ""
  cache:
    dir: "data/cache"
    max_gb: 10


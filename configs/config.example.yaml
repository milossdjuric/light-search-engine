# Search Engine Configuration Example
# Copy to configs/local.yaml and adjust as needed.
# Run: go run cmd/server/main.go -config configs/local.yaml

server:
  host: "0.0.0.0"
  port: 8080
  # mode: coordinator | shard
  mode: "shard"

storage:
  data_dir: "data"

index:
  # mem_threshold_mb: flush in-memory buffer when it exceeds this size
  mem_threshold_mb: 512
  # max_buffer_docs: also flush when this many documents are buffered
  max_buffer_docs: 100000
  # How soon new writes become searchable (ms). Search rebuilds the in-memory
  # buffer snapshot at most this often after writes; 0 = on the next search,
  # -1 = only after a flush.
  refresh_interval_ms: 1000
  # num_shards: immutable after first index — changing requires full re-index
  num_shards: 4
  bm25_k1: 1.2
  bm25_b: 0.75
  segments_per_tier: 15
  max_merge_at_once: 10
  max_merge_size_mb: 256
  merge_rate_limit_mbps: 80
  # bloom_fp_rate: per-segment bloom filter (0 = disabled). 0.01 recommended.
  bloom_fp_rate: 0.01
  merge_on_startup: true
  startup_merge_target: 2
  warmup_on_startup: true
  warmup_mode: "tiered"        # top_k | full | tiered
  warmup_tier_threshold_mb: 600
  warmup_top_terms: 1000
  stemming:
    enabled: false
    language: "english"
  stopwords:
    enabled: false

search:
  # global_fusion: "score" (default) | "rrf"
  global_fusion: "score"
  default_top_k: 10
  query_cache_size: 1000
  doc_cache_size: 50000

logging:
  level: "info"
  format: "text"

# Cluster config (distributed mode)
# cluster:
#   local_shards: [0, 1, 2, 3]      # shard node: global shard IDs this node owns
#   total_shards: 16
#   # coordinator: shard-node HTTP addresses; each node's shards are learned
#   # from its /health (local_shards) and refreshed every 10s.
#   bootstrap_addrs:
#     - "node-1:8080"
#   grpc_addr: "node-1:9090"
#   # WAL replication (shard mode): "" = off, "primary" = serve every local
#   # shard's WAL over gRPC on grpc_addr's port, "replica" = follow
#   # primary_addr and reject client writes. Primary and replica must use the
#   # same index.num_shards.
#   replication_role: ""
#   primary_addr: "node-1:9090"   # replica only

server:
  host: "0.0.0.0"
  port: 8080
  mode: "shard"

storage:
  data_dir: "data"

index:
  num_shards: 4
  # fsync the WAL once per bulk request, matching Elasticsearch's default
  # translog durability ("request") so indexing speed compares like for like.
  wal_durability: "sync"
  mem_threshold_mb: 512
  max_buffer_docs: 100000
  bm25_k1: 1.2
  bm25_b: 0.75
  segments_per_tier: 15
  max_merge_at_once: 10
  max_merge_size_mb: 256
  merge_rate_limit_mbps: 80
  merge_io_burst_mb: 64
  bloom_fp_rate: 0.01
  merge_on_startup: true
  startup_merge_target: 2
  warmup_on_startup: true
  warmup_top_terms: 1000
  warmup_mode: "tiered"
  warmup_tier_threshold_mb: 600
  stopwords:
    enabled: false
  stemming:
    enabled: false

search:
  global_fusion: "score"
  default_top_k: 10
  # Off for benchmarks: the harness repeats every query in an untimed warm-up
  # pass, and ES does not cache queries that return hits (size > 0).
  query_cache_size: 0
  doc_cache_size: 50000

logging:
  level: "info"
  format: "json"


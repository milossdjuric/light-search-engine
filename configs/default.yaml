server:
  host: "0.0.0.0"
  port: 8080
  mode: "shard"

storage:
  data_dir: "data"

index:
  mem_threshold_mb: 512
  max_buffer_docs: 100000
  num_shards: 4
  bm25_k1: 1.2
  bm25_b: 0.75
  merge_on_startup: false
  segments_per_tier: 15
  max_merge_at_once: 10
  max_merge_size_mb: 256
  merge_rate_limit_mbps: 80
  bloom_fp_rate: 0.01        # 0 = disabled
  stopwords:
    enabled: false            # false = better recall for natural-language queries (MSMARCO/BEIR)
  stemming:
    enabled: false
    language: "english"

search:
  global_fusion: "score"
  default_top_k: 10
  query_cache_size: 1000     # 0 = disabled

logging:
  level: "info"
  format: "text"
